[package]
name = "imprint-client"
version = "0.1.0"
description = "imprint backend admin console"
authors = ["imprint"]
edition = "2021"

[lib]
name = "imprint_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
zip = "2"
thiserror = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[dev-dependencies]
httpmock = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
