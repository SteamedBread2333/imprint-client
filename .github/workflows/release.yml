# Build Tauri installers and publish a GitHub Release when you push a version tag.
# Tag example: git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Imprint Console v__VERSION__
          releaseBody: |
            ## Imprint Console v__VERSION__

            Tauri desktop build of [imprint-client](https://github.com/SteamedBread2333/imprint-client) — backend admin console for the imprint stack.

            ### Downloads
            Pick the asset for your OS (`.dmg` / `.msi` / `.exe` / `.AppImage` or `.deb`, depending on what the build produced).

            ### Notes
            - macOS builds are **ad-hoc signed** (`signingIdentity: "-"`) so the app bundle seal is valid. They are not notarized unless Apple signing secrets are configured; Gatekeeper may still ask for approval on first open.
            - First launch can **install runtime** (imprint CLI, Python, embed sidecar) when online; embed config is global (`~/.imprint/embed.yaml`).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
